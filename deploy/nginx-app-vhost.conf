# --- Web app, same-origin (DEPLOYMENT §6A): the page and /api answer on ONE host,
#     so the session cookie is first-party and iOS Safari stops dropping it.
#     Rendered by deploy/vps-frontend-same-origin.sh (@@APP_HOST@@ -> the real host).
#     /api is a longer prefix than /, so nginx routes it to the API regardless of
#     order; the socket.io block still has to be the longest match of the two.
server {
  listen 80;
  server_name @@APP_HOST@@;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name @@APP_HOST@@;

  ssl_certificate     /etc/letsencrypt/live/@@API_HOST@@/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/@@API_HOST@@/privkey.pem;

  client_max_body_size 12m;                 # voice notes travel through this host too
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/socket.io {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    # Literal, not $connection_upgrade: this box has no `map` in the http context
    # (verified 2026-10-25 — the installed api. vhost does exactly this, and the
    # socket is websocket-only by design). Referencing an undefined variable is an
    # [emerg], which fails `nginx -t` and rolls the whole append back.
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SSR server (nitro node-server, natlas-frontend.service on 127.0.0.1:3100).
  # No cache headers on purpose: the page renders per request and the session is
  # in the cookie, so a shared-key intermediary cache could hand one student's
  # signed-in shell to another.
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
